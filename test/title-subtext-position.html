<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <!-- <script src="ut/lib/canteen.js"></script> -->
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <style>
        </style>



        <div id="main0"></div>
        <div id="main1"></div>
        <div id="main2"></div>

        <script>
        require(['echarts'], function (echarts) {
            var option;

            option = {
                title: {
                    text: 'Main Title',
                    subtext: 'Subtext Above',
                    left: 'center',
                    top: 'center',
                    subtextStyle: {
                        top: 'top',
                        color: 'red'
                    }
                },
                series: []
            };

            testHelper.create(echarts, 'main0', {
                title: [
                    'Test subtextStyle.top: "top"',
                    'Subtext should be ABOVE the main title'
                ],
                option: option
            });

            option = {
                title: {
                    text: 'Main Title',
                    subtext: 'Subtext Right',
                    left: 0,
                    top: 0,
                    right: 0,
                    itemGap: 100,
                    subtextStyle: {
                        left: 300,
                        top: 0,
                        color: 'blue'
                    }
                },
                series: []
            };

            testHelper.create(echarts, 'main1', {
                title: [
                    'Test subtextStyle.left: "right"',
                    'Subtext should be to the RIGHT of the main title'
                ],
                option: option
            });

            option = {
                title: {
                    text: 'Main Title',
                    subtext: 'Subtext Left Offset 20%',
                    left: 'center',
                    top: 'center',
                    subtextStyle: {
                        left: '20%',
                        color: 'green'
                    }
                },
                series: []
            };

            testHelper.create(echarts, 'main2', {
                title: [
                    'Test subtextStyle.left: "20%"',
                    'Subtext should be shifted to the right by 20% of main title width'
                ],
                option: option
            });
        });
        </script>


    </body>
</html>
